<text x="550" y="56" font-family="Arial,sans-serif" font-weight="700" font-size="30" text-anchor="middle" fill="#0f172a">SafeDrop · Arquitectura del prototipo</text>
<text x="550" y="87" font-family="Arial,sans-serif" font-size="16" text-anchor="middle" fill="#475569">Azul: probado | Gris: planeado / integración pendiente</text>
