<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="670" viewBox="0 0 1100 670" role="img" aria-labelledby="title desc">
<title id="title">Arquitectura SafeDrop</title>
<desc id="desc">Dos ESP32: la ESP32-S3 con camara envia imagenes RGB565 por TCP a Python con OpenCV y lectura QR; la ESP32 de control publica PIR, LDR, HC-SR04 y datos HX711 tras su calibracion, y controla rele, SG90 y buzzer por MQTT. Firebase, IA real y dashboard estan pendientes.</desc>
