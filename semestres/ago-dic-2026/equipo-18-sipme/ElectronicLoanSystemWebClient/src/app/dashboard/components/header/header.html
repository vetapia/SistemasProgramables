<header class="navbar sticky top-0 z-30 border-b border-base-300 bg-base-100 px-4">
  <div class="navbar-start gap-2">
    <label
      for="dashboard-drawer"
      aria-label="Abrir menú"
      class="btn btn-ghost btn-circle lg:hidden"
    >
      <svg
        xmlns="http://www.w3.org/2000/svg"
        fill="none"
        viewBox="0 0 24 24"
        stroke-width="1.5"
        stroke="currentColor"
        class="size-6"
        aria-hidden="true"
      >
        <path
          stroke-linecap="round"
          stroke-linejoin="round"
          d="M3.75 6.75h16.5M3.75 12h16.5m-16.5 5.25h16.5"
        />
      </svg>
    </label>
    <h1 class="text-lg font-semibold">Panel</h1>
  </div>

  <div class="navbar-end gap-2">
    <label class="swap swap-rotate btn btn-ghost btn-circle" aria-label="Cambiar tema">
      <input type="checkbox" value="dark" class="theme-controller" />
      <span class="swap-off">
        <svg
          xmlns="http://www.w3.org/2000/svg"
          fill="none"
          viewBox="0 0 24 24"
          stroke-width="1.5"
          stroke="currentColor"
          class="size-5"
          aria-hidden="true"
        >
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            d="M12 3v2.25m6.364.386-1.591 1.591M21 12h-2.25m-.386 6.364-1.591-1.591M12 18.75V21m-4.773-4.227-1.591 1.591M5.25 12H3m4.227-4.773L5.636 5.636M15.75 12a3.75 3.75 0 1 1-7.5 0 3.75 3.75 0 0 1 7.5 0Z"
          />
        </svg>
      </span>
      <span class="swap-on">
        <svg
          xmlns="http://www.w3.org/2000/svg"
          fill="none"
          viewBox="0 0 24 24"
          stroke-width="1.5"
          stroke="currentColor"
          class="size-5"
          aria-hidden="true"
        >
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            d="M21.752 15.002A9.72 9.72 0 0 1 18 15.75c-5.385 0-9.75-4.365-9.75-9.75 0-1.33.266-2.597.748-3.752A9.753 9.753 0 0 0 3 11.25C3 16.635 7.365 21 12.75 21a9.753 9.753 0 0 0 9.002-5.998Z"
          />
        </svg>
      </span>
    </label>

    <div class="dropdown dropdown-end">
      <div tabindex="0" role="button" class="btn btn-ghost gap-2 px-2">
        <div class="avatar avatar-placeholder">
          <div class="w-9 rounded-full bg-primary text-primary-content">
            <span class="text-sm font-semibold">{{ initials() }}</span>
          </div>
        </div>
        <div class="hidden text-left sm:block">
          <p class="text-sm font-medium leading-tight">{{ user()?.name }} {{ user()?.lastName }}</p>
          <p class="text-xs text-base-content/60">{{ user()?.email }}</p>
        </div>
      </div>
      <ul
        tabindex="0"
        class="dropdown-content menu z-10 mt-3 w-56 rounded-box border border-base-300 bg-base-100 p-2 shadow"
      >
        <li>
          <button type="button" (click)="logout()">
            <svg
              xmlns="http://www.w3.org/2000/svg"
              fill="none"
              viewBox="0 0 24 24"
              stroke-width="1.5"
              stroke="currentColor"
              class="size-5"
              aria-hidden="true"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                d="M15.75 9V5.25A2.25 2.25 0 0 0 13.5 3h-6a2.25 2.25 0 0 0-2.25 2.25v13.5A2.25 2.25 0 0 0 7.5 21h6a2.25 2.25 0 0 0 2.25-2.25V15M12 9l-3 3m0 0 3 3m-3-3h12.75"
              />
            </svg>
            Cerrar sesión
          </button>
        </li>
      </ul>
    </div>
  </div>
</header>
